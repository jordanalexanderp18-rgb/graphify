# Fly.io: `fly launch --no-deploy` (cambia app y región), luego
# `fly volumes create data --size 1` y `fly deploy`.
app = "silla-llena"
primary_region = "scl"

[build]

[env]
  PORT = "3000"
  DB_FILE = "/data/app.db"
  TRUST_PROXY = "1"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "3s"
