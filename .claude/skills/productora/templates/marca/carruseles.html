<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Marca: carruseles</title>
    <!-- Personal-brand kit, carousel cover in the same three looks as portadas.html:
         A Deportiva, B Diario, C Energía. 1080x1350. Same assets/recorte.png. -->
    <style>
      @font-face { font-family: "Big Shoulders"; src: url("assets/fonts/BigShoulders-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Outfit"; src: url("assets/fonts/Outfit-Regular.ttf"); }
      @font-face { font-family: "Outfit"; src: url("assets/fonts/Outfit-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.ttf"); }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.ttf"); font-style: italic; }
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-Regular.ttf"); }
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Caveat"; src: url("assets/fonts/caveat-latin-700-normal.woff2"); font-weight: 700; }
      @font-face { font-family: "Boldonse"; src: url("assets/fonts/Boldonse-Regular.ttf"); }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Bold.ttf"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; }
      .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
      .slide > * { position: absolute; }

      /* A · Deportiva */
      .a { --navy: #172042; --coral: #ff6b4a; --blush: #f5c6c0; --cream: #fbf5ef; background: var(--navy); color: var(--cream); font-family: "Outfit", sans-serif; }
      .a .stripes { inset: 0; background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.035) 0 2px, transparent 2px 46px); }
      .a .top { left: 88px; right: 88px; top: 84px; display: flex; justify-content: space-between; align-items: baseline; }
      .a .name { font-family: "Big Shoulders", sans-serif; font-weight: 700; font-size: 56px; letter-spacing: 0.06em; color: var(--coral); }
      .a .series { font-weight: 700; font-size: 25px; letter-spacing: 0.2em; color: var(--blush); }
      .a .title { left: 84px; top: 196px; font-family: "Big Shoulders", sans-serif; font-weight: 700; font-size: 168px; line-height: 0.88; }
      .a .title span { display: block; color: var(--coral); }
      .a .sub { left: 88px; top: 540px; width: 400px; font-size: 40px; line-height: 1.25; color: var(--blush); }
      .a .arch { left: 540px; top: 556px; width: 460px; height: 724px; border-radius: 230px 230px 36px 36px; background: var(--coral); }
      .a .cut { height: 740px; left: 552px; top: 516px; filter: drop-shadow(0 26px 30px rgba(5, 8, 25, 0.45)); }
      .a .swipe { left: 88px; bottom: 96px; padding: 18px 32px; border-radius: 999px; background: var(--cream); color: var(--navy); font-weight: 700; font-size: 32px; }

      /* B · Diario */
      .b { --paper: #f6efe6; --ink: #2b2124; --rasp: #b8325a; --blush: #f2c4cc; --soft: #8a6f73; background: var(--paper); color: var(--ink); font-family: "Instrument Sans", sans-serif; }
      .b .grain { inset: 0; z-index: 5; opacity: 0.12; mix-blend-mode: multiply; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      .b .top { left: 90px; right: 90px; top: 84px; display: flex; justify-content: space-between; font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); }
      .b .title { left: 86px; top: 150px; font-family: "Instrument Serif", serif; font-size: 170px; line-height: 0.92; letter-spacing: -0.02em; }
      .b .title em { font-style: italic; color: var(--rasp); }
      .b .hand { left: 590px; top: 352px; font-family: "Caveat", cursive; font-weight: 700; font-size: 58px; color: var(--rasp); transform: rotate(-5deg); }
      .b .polaroid { left: 250px; top: 520px; width: 580px; height: 700px; background: #fff; transform: rotate(3deg); box-shadow: 0 24px 40px rgba(70, 25, 40, 0.18); }
      .b .polaroid .in { position: absolute; left: 28px; top: 28px; right: 28px; height: 560px; background: var(--blush); overflow: hidden; }
      .b .polaroid .in img { position: absolute; height: 540px; left: 104px; top: 24px; }
      .b .polaroid .cap { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-family: "Caveat", cursive; font-weight: 700; font-size: 50px; color: var(--ink); }
      .b .tape { left: 460px; top: 492px; width: 190px; height: 56px; background: rgba(233, 214, 189, 0.85); transform: rotate(-4deg); z-index: 2; }
      .b .swipe { right: 90px; bottom: 70px; font-size: 30px; font-weight: 700; }

      /* C · Energía */
      .c { --lilac: #b9a7ff; --lime: #d4ff3a; --ink: #121212; background: var(--lilac); color: var(--ink); font-family: "Outfit", sans-serif; }
      .c .tag { left: 88px; right: 88px; top: 86px; display: flex; justify-content: space-between; font-family: "Geist Mono", monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.08em; }
      .c .title { left: 84px; top: 150px; font-family: "Boldonse", sans-serif; font-size: 84px; line-height: 1.34; }
      .c .blob { width: 620px; height: 660px; left: 400px; top: 560px; background: var(--lime); border-radius: 47% 53% 42% 58% / 52% 44% 56% 48%; }
      .c .cut { height: 740px; left: 470px; top: 500px; filter: drop-shadow(16px 16px 0 var(--ink)); }
      .c .sticker { left: 88px; top: 620px; background: var(--ink); color: var(--lime); font-weight: 700; font-size: 42px; line-height: 1.15; padding: 22px 30px; border-radius: 26px; transform: rotate(-6deg); }
      .c .swipe { left: 88px; bottom: 92px; font-family: "Geist Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <section class="slide a">
      <div class="stripes"></div>
      <div class="top"><span class="name">NOMBRE</span><span class="series">MI SERIE</span></div>
      <h1 class="title">MI RUTINA<span>DE ESPALDA</span></h1>
      <p class="sub">4 ejercicios para tu próximo día de espalda.</p>
      <div class="arch"></div>
      <img class="cut" src="assets/recorte.png" alt="" />
      <p class="swipe">Desliza →</p>
    </section>

    <section class="slide b">
      <div class="top"><span>Nombre</span><span>diario de gym</span></div>
      <h1 class="title">Mi rutina de<br /><em>espalda</em></h1>
      <p class="hand">(guárdala)</p>
      <div class="polaroid">
        <div class="in"><img src="assets/recorte.png" alt="" /></div>
        <p class="cap">día de espalda</p>
      </div>
      <span class="tape"></span>
      <p class="swipe">Desliza →</p>
      <div class="grain"></div>
    </section>

    <section class="slide c">
      <div class="tag"><span>NOMBRE</span><span>MI SERIE</span></div>
      <h1 class="title">MI RUTINA<br />DE ESPALDA</h1>
      <div class="blob"></div>
      <img class="cut" src="assets/recorte.png" alt="" />
      <p class="sticker">4 ejercicios<br />para guardar</p>
      <p class="swipe">DESLIZA →</p>
    </section>

    <script>
      const n = parseInt(new URLSearchParams(location.search).get("slide") || "0", 10);
      if (n > 0) document.querySelectorAll(".slide").forEach((s, i) => { if (i + 1 !== n) s.style.display = "none"; });
    </script>
  </body>
</html>
