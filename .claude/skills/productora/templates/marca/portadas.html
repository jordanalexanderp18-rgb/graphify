<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Marca: portadas</title>
    <!-- Personal-brand kit, reel cover in three looks with the same content, so the person
         compares them side by side: A Deportiva (navy, coral, blush), B Diario (cream paper,
         serif, handwriting), C Energía (lilac, lime, wide caps). 1080x1920; titles inside the
         grid crop (y 285-1635). assets/recorte.png is the person cut out of a photo with
         scripts/recorte.py (no other people in it). The .cut rules are tuned for a kneeling
         photo: retune height, left and top for each photo and rerun check_layout.cjs. -->
    <style>
      @font-face { font-family: "Big Shoulders"; src: url("assets/fonts/BigShoulders-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Outfit"; src: url("assets/fonts/Outfit-Regular.ttf"); }
      @font-face { font-family: "Outfit"; src: url("assets/fonts/Outfit-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.ttf"); }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.ttf"); font-style: italic; }
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-Regular.ttf"); }
      @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Caveat"; src: url("assets/fonts/caveat-latin-700-normal.woff2"); font-weight: 700; }
      @font-face { font-family: "Boldonse"; src: url("assets/fonts/Boldonse-Regular.ttf"); }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Bold.ttf"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      .slide { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .slide > * { position: absolute; }

      /* A · Deportiva */
      .a { --navy: #172042; --coral: #ff6b4a; --blush: #f5c6c0; --cream: #fbf5ef; background: var(--navy); color: var(--cream); font-family: "Outfit", sans-serif; }
      .a .stripes { inset: 0; background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.035) 0 2px, transparent 2px 46px); }
      .a .top { left: 120px; right: 120px; top: 292px; display: flex; justify-content: space-between; align-items: baseline; }
      .a .name { font-family: "Big Shoulders", sans-serif; font-weight: 700; font-size: 64px; letter-spacing: 0.06em; color: var(--coral); }
      .a .series { font-weight: 700; font-size: 27px; letter-spacing: 0.2em; color: var(--blush); }
      .a .title { left: 0; right: 0; top: 400px; text-align: center; font-family: "Big Shoulders", sans-serif; font-weight: 700; line-height: 0.84; z-index: 1; }
      .a .title .small { display: block; font-size: 150px; color: var(--coral); letter-spacing: 0.02em; }
      .a .title .big { display: block; font-size: 262px; letter-spacing: 0.01em; }
      .a .disc { width: 800px; height: 800px; left: 140px; top: 820px; border-radius: 50%; background: var(--coral); }
      .a .ring { width: 920px; height: 920px; left: 80px; top: 760px; border-radius: 50%; border: 3px solid rgba(245, 198, 192, 0.45); }
      .a .cut { height: 1090px; left: 232px; top: 792px; z-index: 2; filter: drop-shadow(0 34px 40px rgba(5, 8, 25, 0.45)); }
      .a .pill { left: 50%; top: 1548px; transform: translateX(-50%); z-index: 3; white-space: nowrap; background: var(--cream); color: var(--navy); font-weight: 700; font-size: 36px; padding: 18px 34px; border-radius: 999px; }

      /* B · Diario */
      .b { --paper: #f6efe6; --ink: #2b2124; --rasp: #b8325a; --blush: #f2c4cc; --soft: #8a6f73; background: var(--paper); color: var(--ink); font-family: "Instrument Sans", sans-serif; }
      .b .grain { inset: 0; z-index: 5; opacity: 0.12; mix-blend-mode: multiply; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      .b .top { left: 120px; right: 120px; top: 296px; display: flex; justify-content: space-between; font-size: 27px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); }
      .b .title { left: 126px; right: 120px; top: 352px; font-family: "Instrument Serif", serif; font-weight: 400; font-size: 200px; line-height: 0.9; letter-spacing: -0.02em; }
      .b .title em { font-style: italic; color: var(--rasp); }
      .b .card { left: 150px; top: 820px; width: 780px; height: 790px; border-radius: 44px; background: var(--blush); transform: rotate(2.5deg); }
      .b .tape { width: 210px; height: 58px; background: rgba(233, 214, 189, 0.85); z-index: 3; }
      .b .tape1 { left: 118px; top: 820px; transform: rotate(-24deg); }
      .b .tape2 { left: 760px; top: 846px; transform: rotate(28deg); }
      .b .cut { height: 990px; left: 196px; top: 730px; z-index: 2; transform: rotate(-3deg); filter: drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(0 20px 26px rgba(70, 25, 40, 0.28)); }
      .b .hand { left: 640px; top: 728px; width: 300px; z-index: 4; font-family: "Caveat", cursive; font-weight: 700; font-size: 62px; line-height: 1.05; color: var(--rasp); transform: rotate(-5deg); }
      .b .arrow { left: 560px; top: 870px; width: 120px; height: 120px; z-index: 4; }

      /* C · Energía */
      .c { --lilac: #b9a7ff; --lime: #d4ff3a; --ink: #121212; background: var(--lilac); color: var(--ink); font-family: "Outfit", sans-serif; }
      .c .tag { left: 120px; right: 120px; top: 300px; display: flex; justify-content: space-between; font-family: "Geist Mono", monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.08em; }
      .c .title { left: 0; right: 0; top: 352px; text-align: center; font-family: "Boldonse", sans-serif; }
      .c .title .l1 { display: block; font-size: 84px; line-height: 1.7; }
      .c .title .l2 { display: block; font-size: 112px; line-height: 1.34; }
      .c .blob { width: 860px; height: 900px; left: 110px; top: 780px; background: var(--lime); border-radius: 47% 53% 42% 58% / 52% 44% 56% 48%; }
      .c .cut { height: 1090px; left: 222px; top: 700px; z-index: 2; filter: drop-shadow(18px 18px 0 var(--ink)); }
      .c .sticker { left: 610px; top: 1450px; z-index: 3; background: var(--ink); color: var(--lime); font-weight: 700; font-size: 40px; line-height: 1.15; padding: 22px 30px; border-radius: 28px; transform: rotate(-7deg); text-align: center; }
    </style>
  </head>
  <body>
    <section class="slide a">
      <div class="stripes"></div>
      <div class="top"><span class="name">NOMBRE</span><span class="series">MI SERIE</span></div>
      <h1 class="title"><span class="small">DÍA DE</span><span class="big">ESPALDA</span></h1>
      <div class="ring"></div>
      <div class="disc"></div>
      <img class="cut" src="assets/recorte.png" alt="" />
      <p class="pill">4 ejercicios para guardar</p>
    </section>

    <section class="slide b">
      <div class="top"><span>Nombre</span><span>diario de gym</span></div>
      <h1 class="title">Día de<br /><em>espalda</em></h1>
      <div class="card"></div>
      <span class="tape tape1"></span><span class="tape tape2"></span>
      <img class="cut" src="assets/recorte.png" alt="" />
      <p class="hand">4 ejercicios, guárdala</p>
      <svg class="arrow" viewBox="0 0 120 120" fill="none" stroke="#b8325a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M104 10 C 92 52, 64 78, 18 96" />
        <path d="M40 80 L 16 97 L 44 106" />
      </svg>
      <div class="grain"></div>
    </section>

    <section class="slide c">
      <div class="tag"><span>NOMBRE</span><span>MI SERIE</span></div>
      <h1 class="title"><span class="l1">DÍA DE</span><span class="l2">ESPALDA</span></h1>
      <div class="blob"></div>
      <img class="cut" src="assets/recorte.png" alt="" />
      <p class="sticker">4 ejercicios<br />para guardar</p>
    </section>

    <script>
      const n = parseInt(new URLSearchParams(location.search).get("slide") || "0", 10);
      if (n > 0) document.querySelectorAll(".slide").forEach((s, i) => { if (i + 1 !== n) s.style.display = "none"; });
    </script>
  </body>
</html>
