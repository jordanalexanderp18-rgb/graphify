<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Estilo Collage</title>
    <!-- Collage: the handmade 2026 look. Kraft paper, taped polaroids, handwritten notes,
         a torn paper strip for the headline and a rubber stamp. Imperfect on purpose. -->
    <style>
      @font-face { font-family: "Bricolage"; src: url("assets/fonts/BricolageGrotesque-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Bricolage"; src: url("assets/fonts/BricolageGrotesque-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Hand"; src: url("assets/fonts/NothingYouCouldDo-Regular.ttf"); }
      @page { size: 1080px 1350px; margin: 0; }
      :root { --paper: #e9dcc5; --ink: #1d1a16; --blue: #2846a8; --red: #d7263d; --tape: rgba(255, 236, 170, 0.78); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--paper); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      @media print { html, body { height: auto; overflow: visible; } .slide { break-after: page; } }
      .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Bricolage", sans-serif; }
      .fiber { position: absolute; inset: 0; opacity: 0.22; mix-blend-mode: multiply; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.55' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.2  0 0 0 0.9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
      .pol { position: absolute; background: #fbfaf6; padding: 20px 20px 86px; box-shadow: 0 18px 40px rgba(40, 25, 10, 0.28); }
      .pol img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .pol .cap { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font-family: "Hand", cursive; font-size: 40px; color: var(--blue); }
      .tape { position: absolute; width: 190px; height: 54px; background: var(--tape); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08); }
      .torn { position: absolute; background: #fbfaf6; padding: 34px 44px 40px; clip-path: polygon(0 6%, 4% 0, 9% 5%, 15% 1%, 22% 6%, 30% 0, 37% 5%, 45% 1%, 53% 6%, 61% 0, 69% 5%, 77% 1%, 85% 6%, 92% 0, 100% 5%, 99% 94%, 94% 100%, 87% 95%, 79% 100%, 71% 95%, 63% 100%, 55% 95%, 47% 100%, 39% 95%, 31% 100%, 23% 95%, 15% 100%, 7% 95%, 0 100%); box-shadow: 0 10px 30px rgba(40, 25, 10, 0.2); }
      .torn .h { font-size: 88px; font-weight: 700; line-height: 0.98; text-transform: uppercase; letter-spacing: -0.01em; }
      .hand { position: absolute; font-family: "Hand", cursive; color: var(--blue); line-height: 1.15; }
      .stamp { position: absolute; width: 230px; height: 230px; border: 7px solid var(--red); border-radius: 50%; color: var(--red); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 34px; font-weight: 700; line-height: 1.05; text-transform: uppercase; opacity: 0.85; }
      .label { position: absolute; white-space: nowrap; background: var(--red); color: #fff; padding: 16px 30px; font-size: 76px; font-weight: 700; text-transform: uppercase; box-shadow: 0 8px 20px rgba(40, 25, 10, 0.25); }
      .sticker { position: absolute; width: 180px; height: 180px; background: #fbfaf6; display: flex; align-items: center; justify-content: center; font-size: 110px; font-weight: 700; box-shadow: 0 10px 24px rgba(40, 25, 10, 0.25); }
      .name { position: absolute; width: 220px; text-align: center; font-family: "Hand", cursive; font-size: 32px; color: var(--blue); }
      .handle { position: absolute; left: 80px; bottom: 60px; font-size: 26px; letter-spacing: 0.04em; }
      svg.doodle { position: absolute; overflow: visible; }
    </style>
  </head>
  <body>
    <section class="slide">
      <div class="pol" style="left: 70px; top: 120px; width: 540px; height: 680px; transform: rotate(-6deg)"><img src="assets/c-1350.jpg" alt="" style="object-position: 50% 30%" /><span class="cap">día de pierna</span></div>
      <span class="tape" style="left: 250px; top: 95px; transform: rotate(-10deg)"></span>
      <div class="pol" style="left: 600px; top: 300px; width: 400px; height: 520px; transform: rotate(7deg)"><img src="assets/a-1350.jpg" alt="" style="object-position: 30% 70%" /><span class="cap">paso a paso</span></div>
      <span class="tape" style="left: 720px; top: 285px; transform: rotate(12deg)"></span>
      <div class="torn" style="left: 60px; top: 900px; width: 960px; transform: rotate(-1.5deg)"><span class="h">4 ejercicios para piernas fuertes</span></div>
      <span class="hand" style="left: 700px; top: 1165px; font-size: 58px; transform: rotate(-6deg)">¡guárdalo!</span>
      <svg class="doodle" style="left: 600px; top: 1170px" width="100" height="80" viewBox="0 0 100 80"><path d="M90 10 C60 20 40 40 20 66 M20 66 L22 40 M20 66 L44 60" fill="none" stroke="#2846a8" stroke-width="5" stroke-linecap="round" /></svg>
      <div class="fiber"></div>
    </section>
    <section class="slide">
      <div class="pol" style="left: 80px; top: 110px; width: 620px; height: 800px; transform: rotate(-3deg)"><img src="assets/a-1350.jpg" alt="" style="object-position: 30% 70%" /><span class="cap">así se baja</span></div>
      <span class="tape" style="left: 300px; top: 85px; transform: rotate(4deg)"></span>
      <span class="label" style="left: 70px; top: 905px; transform: rotate(-3deg)">1. Sentadilla</span>
      <span class="hand" style="left: 90px; top: 1062px; width: 900px; font-size: 62px; transform: rotate(-2deg)">pecho arriba, rodillas afuera y baja controlado ✓</span>
      <div class="stamp" style="right: 60px; top: 140px; transform: rotate(14deg)">Ejercicio<br />1 de 4</div>
      <span class="handle">@jordan_pincheira</span>
      <div class="fiber"></div>
    </section>
    <section class="slide">
      <span class="hand" style="left: 80px; top: 150px; width: 920px; font-size: 112px; color: var(--ink); transform: rotate(-3deg)">¿cuál te cuesta más?</span>
      <div class="sticker" style="left: 90px; top: 640px; transform: rotate(-6deg)">1</div>
      <div class="sticker" style="left: 320px; top: 600px; transform: rotate(4deg)">2</div>
      <div class="sticker" style="left: 550px; top: 650px; transform: rotate(-3deg)">3</div>
      <div class="sticker" style="left: 780px; top: 610px; transform: rotate(7deg)">4</div>
      <span class="tape" style="left: 360px; top: 585px; transform: rotate(-4deg); width: 120px"></span>
      <span class="name" style="left: 70px; top: 840px; transform: rotate(-4deg)">sentadilla</span>
      <span class="name" style="left: 300px; top: 800px; transform: rotate(3deg)">peso muerto</span>
      <span class="name" style="left: 530px; top: 850px; transform: rotate(-2deg)">estocadas</span>
      <span class="name" style="left: 760px; top: 810px; transform: rotate(5deg)">hip thrust</span>
      <div class="stamp" style="left: 420px; top: 960px; transform: rotate(-10deg)">Comenta<br />tu número</div>
      <span class="handle">@jordan_pincheira</span>
      <div class="fiber"></div>
    </section>
    <script>
      const n = parseInt(new URLSearchParams(location.search).get("slide") || "0", 10);
      if (n > 0) document.querySelectorAll(".slide").forEach((s, i) => { if (i + 1 !== n) s.style.display = "none"; });
    </script>
  </body>
</html>
